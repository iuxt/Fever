<main id="main-content" class="hero-body">
  <div class="container has-text-centered">
    <p class="eyebrow"><span aria-hidden="true">●</span> 本地优先 · Markdown · Git</p>
    <h1 class="title is-1">{{ site.Params.hero.title }}</h1>
    <p class="hero-description">{{ site.Params.hero.subtitle }}</p>
    <div class="hero-actions">
      <a class="button primary-action" href="{{ site.Params.hero.buttonlink }}">{{ site.Params.hero.buttontext }} <span aria-hidden="true">↓</span></a>
      <a class="button secondary-action" href="https://github.com/iuxt/Fever">在 GitHub 上查看 <span aria-hidden="true">↗</span></a>
    </div>
    <p class="platform-note">为 macOS、Windows 和 Linux 而作</p>
    <figure class="app-preview">
      <img src="{{ "images/fever-app.png" | relURL }}" alt="Fever 浏览器示例界面：文件夹、笔记列表与 Markdown 编辑区" width="1440" height="1000" fetchpriority="high">
      <figcaption>Fever 的三栏写作空间 · 示例笔记</figcaption>
    </figure>
  </div>
</main>
