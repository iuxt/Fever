name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[1-9][0-9]*$ ]]; then
            echo "Expected a positive integer tag: 1, 2, 3, ..." >&2
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Fever $GITHUB_REF_NAME" --generate-notes \
              --prerelease=false
          fi

  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-latest
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git lfs install
      - run: npm ci
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        # Tags use sequential integers; npm/electron-builder require a SemVer package version.
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[1-9][0-9]*$ ]]; then
            echo "Expected a positive integer tag: 1, 2, 3, ..." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME}.0.0"
          npm version "$version" --no-git-tag-version --ignore-scripts --allow-same-version
      - run: npm test
      - run: npm run dist:${{ matrix.target }} -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers directly to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          installers=(*.dmg *.zip *.exe *.AppImage *.deb)
          if (( ${#installers[@]} == 0 )); then
            echo "No installers found to upload" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${installers[@]}" --clobber

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir release \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' \
            --pattern '*.AppImage' --pattern '*.deb'
          cd release
          sha256sum ./* > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
