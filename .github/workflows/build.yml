name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-latest
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git lfs install
      - run: npm ci
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        # npm validates SemVer; update only the runner's package files, without a commit/tag.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Expected a version tag such as v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --ignore-scripts --allow-same-version
      - run: npm test
      - run: npm run dist:${{ matrix.target }} -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Fever-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Fever-*
          path: release
          merge-multiple: true
      - name: Publish installers
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum ./* > SHA256SUMS.txt

          prerelease=false
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          # Keep a new release in draft until every asset has uploaded successfully.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Fever $GITHUB_REF_NAME" --generate-notes \
              --prerelease="$prerelease"
          fi
          gh release upload "$GITHUB_REF_NAME" ./* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease"
